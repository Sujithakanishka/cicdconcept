name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Push to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
        
      - name: Execute remote SSH commands using password
        uses: appleboy/ssh-action@v1
        with:
          host: 51.20.114.30
          username: ubuntu
          key: ${{ secrets.PRIVATE_SSH_KEY }}
          port: 22
          script: |
           cd Devops_Example
           git fetch + git reset --hard 
           npm install
           npm run build 
           pm2 start / restart

           
      

